# Free-tier Colab: exponential epoch curriculum (k_start * decay^epoch; same k all layers)
out_dir: results/colab
metric_best: ap
wandb:
  use: False
  project: Peptides-func-adaptive-k
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_LapPE:
  enable: False
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  raw_norm_type: none
posenc_RWSE:
  enable: False
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  ckpt_best: True
  enable_ckpt: True
  auto_resume: True
  mode: custom
  batch_size: 64
  eval_period: 1
  ckpt_period: 10
model:
  auto_satisfy_param_budget: True
  param_budget: 500000
  type: GPSModel
  loss_fun: cross_entropy
  graph_pooling: mean
gt:
  layer_type: CustomGatedGCN+SparseAttention
  layers: 8
  n_heads: 4
  dim_hidden: 76
  dropout: 0.1
  attn_dropout: 0.5
  layer_norm: True
  batch_norm: False
  sparse:
    k: 15
    k_schedule: exponential
    k_start: 45
    k_decay: 0.7
    k_min: 5
    kq_dim: 10
    val_dim: 19
    head_agg: none
gnn:
  head: mlp_graph
  layers_pre_mp: 0
  layers_mp: 8
  layers_post_mp: 2
  dim_inner: 76
  batchnorm: True
  act: gelu
  dropout: 0.1
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 100
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
