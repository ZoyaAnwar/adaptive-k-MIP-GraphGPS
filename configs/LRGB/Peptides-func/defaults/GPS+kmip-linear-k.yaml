out_dir: results
metric_best: ap
wandb:
  use: False
  project: Peptides-func
dataset:
  format: OGB
  name: peptides-functional
  task: graph
  task_type: classification_multilabel
  transductive: False
  node_encoder: True
  node_encoder_name: Atom
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_LapPE:
  enable: False
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  raw_norm_type: none
posenc_RWSE:
  enable: False
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  ckpt_best: True
  mode: custom
  batch_size: 8
  eval_period: 1
  ckpt_period: 100
model:
  auto_satisfy_param_budget: False
  param_budget: 500000
  type: GPSModel
  loss_fun: cross_entropy
  graph_pooling: mean
gt:
  layer_type: CustomGatedGCN+SparseAttention
  layers: 4
  n_heads: 4
  dim_hidden: 64
  dropout: 0.1
  attn_dropout: 0.5
  layer_norm: True
  batch_norm: False
  sparse:
    k: 15
    k_schedule: linear
    k_start: 15
    k_end: 3
    kq_dim: 8
    val_dim: 16
    head_agg: none
gnn:
  head: mlp_graph
  layers_pre_mp: 0
  layers_mp: 4
  layers_post_mp: 2
  dim_inner: 64
  batchnorm: True
  act: gelu
  dropout: 0.1
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 2
  scheduler: cosine_with_warmup
  num_warmup_epochs: 1
